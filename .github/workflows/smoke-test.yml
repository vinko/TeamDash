name: Preview smoke test (no deploy)

# Runs only on the feature branch or when started manually.
# It never deploys to GitHub Pages.
on:
  push:
    branches: [ "feature/delete-team-member" ]
    paths:
      - ".github/smoke/**"
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        id: install
        run: npm install 2>&1 | tee install.log; exit ${PIPESTATUS[0]}

      - name: Build
        id: build
        run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Install Playwright and Chromium
        id: pw
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start preview server
        id: preview
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "Preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not start"
          cat preview.log
          exit 1

      - name: Run smoke test
        id: smoke
        run: node .github/smoke/smoke.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke-final.png
          if-no-files-found: ignore

      - name: Post results to issue #4
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (f, n) => {
              try {
                const t = fs.readFileSync(f, 'utf8');
                return t.length > n ? '...' + t.slice(-n) : t;
              } catch (e) { return '(not available)'; }
            };
            const outcome = (id, steps) => (steps[id] && steps[id].outcome) || 'skipped';
            const steps = ${{ toJSON(steps) }};
            const rows = [
              ['npm install', outcome('install', steps)],
              ['npm run build', outcome('build', steps)],
              ['Playwright setup', outcome('pw', steps)],
              ['Preview server', outcome('preview', steps)],
              ['Browser smoke test', outcome('smoke', steps)]
            ].map(r => '| ' + r[0] + ' | ' + r[1] + ' |').join('\n');

            let body = '## Smoke test on `feature/delete-team-member`\n\n'
              + 'Commit: `' + context.sha.slice(0, 7) + '`\n\n'
              + '| Stage | Result |\n| --- | --- |\n' + rows + '\n\n';

            if (outcome('install', steps) === 'failure') {
              body += '### npm install output\n```\n' + read('install.log', 3000) + '\n```\n';
            }
            if (outcome('build', steps) === 'failure') {
              body += '### Build output (last part)\n```\n' + read('build.log', 3000) + '\n```\n';
            }
            if (fs.existsSync('smoke-report.md')) {
              body += '### Browser test report\n' + read('smoke-report.md', 4000) + '\n';
            }
            if (outcome('preview', steps) === 'failure') {
              body += '### Preview server log\n```\n' + read('preview.log', 2000) + '\n```\n';
            }
            body += '\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body
            });
